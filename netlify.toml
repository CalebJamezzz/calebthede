[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."ask"]
  timeout = 26

# -- Maintenance mode --
# To enable: uncomment the maintenance block and comment out the others
# [[redirects]]
#   from = "/*"
#   to = "/maintenance.html"
#   status = 302
#   force = true

# -- Clean URL rewrites (serve /about instead of /about.html) --
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/projects"
  to = "/projects.html"
  status = 200

[[redirects]]
  from = "/library"
  to = "/library.html"
  status = 200

[[redirects]]
  from = "/marginalia"
  to = "/marginalia.html"
  status = 200

# -- Lab embed --
[[redirects]]
  from = "/lab-embed"
  to = "/lab-embed.html"
  status = 200

[[redirects]]
  from = "/lab"
  to = "/lab.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# -- Admin (Scriptorium) --
[[redirects]]
  from = "/compose"
  to = "/compose.html"
  status = 200

# -- API function routes --
[[redirects]]
  from = "/api/ask"
  to = "/.netlify/functions/ask"
  status = 200
  force = true

# -- Tools --
[[redirects]]
  from = "/tools/doc-to-html"
  to = "/tools/doc-to-html.html"
  status = 200

# -- Real subdomains: library / marginalia / forge --
# Each subdomain is a domain alias on this same Netlify site (added in the
# dashboard, DNS pointed there separately) — these rules serve the right
# page at that subdomain's root. The exact-root rule is forced because
# index.html existing at "/" in the shared file tree would otherwise shadow
# it; the wildcard rule is deliberately NOT forced so real asset requests
# (css/js/images) keep resolving to the actual files instead of being
# rewritten to the page HTML too.
[[redirects]]
  from = "https://library.calebthede.com/"
  to = "/library.html"
  status = 200
  force = true

[[redirects]]
  from = "https://library.calebthede.com/shelf"
  to = "/library-shelf.html"
  status = 200
  force = true

[[redirects]]
  from = "https://library.calebthede.com/blue-ember"
  to = "/library-blue-ember.html"
  status = 200
  force = true

[[redirects]]
  from = "https://library.calebthede.com/*"
  to = "/library.html"
  status = 200

[[redirects]]
  from = "https://marginalia.calebthede.com/"
  to = "/marginalia.html"
  status = 200
  force = true

[[redirects]]
  from = "https://marginalia.calebthede.com/*"
  to = "/marginalia.html"
  status = 200

[[redirects]]
  from = "https://forge.calebthede.com/"
  to = "/projects.html"
  status = 200
  force = true

[[redirects]]
  from = "https://forge.calebthede.com/*"
  to = "/projects.html"
  status = 200


# -- 404 fallback --
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
